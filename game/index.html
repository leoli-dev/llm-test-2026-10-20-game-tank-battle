<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STEEL HORIZON — 昼袭战区</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2320261c'/%3E%3Crect x='6' y='12' width='20' height='12' fill='%2366744a'/%3E%3Crect x='12' y='8' width='8' height='8' fill='%23454f33'/%3E%3Crect x='14' y='2' width='4' height='8' fill='%238d9a63'/%3E%3C/svg%3E" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #101408; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #cfe8c2; user-select: none;
    display: flex; flex-direction: column;
  }

  /* ---------- 顶部栏（独立信息区，不覆盖画布） ---------- */
  #topbar {
    position: relative; z-index: 5; flex: 0 0 auto; height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 0 14px;
    background: #131a0c; border-bottom: 1px solid rgba(120, 180, 90, 0.4);
  }
  #topbar .tb-left { display: flex; align-items: baseline; gap: 14px; min-width: 0; flex: 0 1 auto; }
  #score { font-size: 24px; font-weight: 800; color: #ffd76a; text-shadow: 0 0 10px rgba(255, 200, 80, 0.45); font-family: 'Consolas', monospace; }
  #info { font-size: 12.5px; color: #b8d49a; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .tb-right { display: flex; gap: 8px; flex: 0 0 auto; }
  /* 横幅：顶部栏中间的独立伸缩区（静态布局，与左右两组永不相交）；隐藏时不占位 */
  #banner-zone { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  #banner {
    max-width: 100%; text-align: center;
    font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #eaffd8;
    background: rgba(8, 14, 5, 0.88); border: 1px solid rgba(120, 180, 90, 0.55);
    padding: 6px 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 0 8px rgba(140, 255, 170, 0.5);
  }

  /* ---------- 画布区（战场独占，HUD 不得进入） ---------- */
  #stage { flex: 1 1 auto; position: relative; min-height: 0; }
  #stage canvas { display: block; }

  /* ---------- 底部栏 ---------- */
  #botbar {
    flex: 0 0 auto; min-height: 56px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 8px 14px;
    background: #131a0c; border-top: 1px solid rgba(120, 180, 90, 0.4);
  }
  .stat { display: flex; flex-direction: column; gap: 3px; }
  .bar-label { font-size: 11px; letter-spacing: 2px; color: #9dbb86; display: flex; justify-content: space-between; gap: 12px; }
  .bar { width: 180px; height: 12px; background: #1a2214; border: 1px solid #3a4a2c; }
  .bar > div { height: 100%; transition: width 0.1s; }
  #hullbar { background: #54d164; width: 100%; }
  #heatbar { background: linear-gradient(90deg, #e0b83e, #e0602a); width: 0%; }
  #enemybar { background: #e04b3e; width: 100%; }
  #lives { font-size: 17px; letter-spacing: 4px; color: #7dff9a; text-shadow: 0 0 6px rgba(90, 255, 140, 0.5); line-height: 1.4; }
  .bad { color: #ff6a4a !important; }

  /* 小地图：默认收起；展开后停靠底部栏右侧（画布外） */
  #minimap-wrap { display: none; align-items: center; gap: 8px; }
  #minimap-wrap.on { display: flex; }
  #minimap { display: block; width: 96px; height: 96px; image-rendering: pixelated; border: 1px solid rgba(120, 180, 90, 0.5); }
  #minimap-label { font-size: 10px; letter-spacing: 3px; color: #9dbb86; }

  button {
    font-family: inherit; font-size: 14px; letter-spacing: 2px;
    background: #17210f; color: #b9e09a; border: 1px solid #5c7a3e;
    padding: 8px 16px; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  button:hover { background: #223315; color: #e4ffc4; }
  button.primary { background: #2c4a18; border-color: #86c95c; color: #eaffd8; font-weight: 700; }
  button:disabled { opacity: 0.5; cursor: default; }

  #crosshair {
    position: fixed; z-index: 6; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none;
    border: 2px solid rgba(140, 255, 170, 0.85); border-radius: 50%;
    box-shadow: 0 0 8px rgba(90, 255, 140, 0.5), inset 0 0 6px rgba(90, 255, 140, 0.3);
  }
  #crosshair::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; background: #7dff9a; border-radius: 50%; }

  #vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(200, 30, 10, 0.55) 100%);
  }

  /* ---------- 全屏界面（菜单/暂停/结算，覆盖整窗属正常） ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 4, 0.78);
    padding: 16px;
  }
  .screen.hidden { display: none; }
  .hidden { display: none !important; }
  .card {
    background: rgba(10, 16, 7, 0.92); border: 1px solid #4a6a32; padding: 30px 38px; text-align: center;
    max-width: 620px; width: 94%; max-height: 92vh; overflow-y: auto;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 60px rgba(60, 100, 40, 0.08);
  }
  h1 { font-size: 42px; letter-spacing: 10px; color: #d9ffb8; text-shadow: 0 0 24px rgba(120, 255, 150, 0.5); margin-bottom: 4px; }
  .sub { color: #86a871; letter-spacing: 6px; margin-bottom: 18px; font-size: 13px; }
  .goal {
    text-align: left; font-size: 13.5px; line-height: 1.9; color: #c4ddb0;
    border: 1px dashed #4a6a32; padding: 12px 18px; margin-bottom: 18px;
  }
  .goal b { color: #ffd76a; }
  .goal .k { color: #7dff9a; font-family: Consolas, monospace; }
  .diff-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .diff-btn.sel { background: #4a3a12; border-color: #e0b83e; color: #ffe9a8; }
  #btnStart { font-size: 19px; padding: 13px 44px; }
  .keys { margin-top: 18px; font-size: 12px; color: #7e9a68; line-height: 1.9; }
  .board-box { text-align: left; margin-top: 16px; }
  .board-box h3 { font-size: 13px; letter-spacing: 3px; color: #ffd76a; margin-bottom: 8px; }
  .board-box table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .board-box th, .board-box td { padding: 4px 8px; border-bottom: 1px solid #2a3a1e; text-align: center; }
  .board-box th { color: #86a871; }
  .board-box .me td { color: #ffe9a8; background: rgba(224, 184, 62, 0.08); }
  .board-box .empty { color: #5c7a4a; font-size: 12px; padding: 8px 0; }

  #over-title, #pause-title { font-size: 36px; font-weight: 800; letter-spacing: 12px; margin-bottom: 10px; }
  #over-title.win, #pause-title { color: #8dffab; text-shadow: 0 0 20px rgba(120, 255, 160, 0.5); }
  #over-title.lose { color: #ff6a5a; text-shadow: 0 0 20px rgba(255, 90, 70, 0.5); }
  #over-reason { color: #b8d49a; font-size: 14px; margin-bottom: 8px; min-height: 18px; }
  #over-stats { font-size: 14px; color: #b8d49a; margin-bottom: 18px; }
  #over-stats b { color: #ffd76a; }
  .btn-row { display: flex; gap: 12px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
  #name-input {
    font-family: inherit; font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    background: #101808; border: 1px solid #4a6a32; color: #d9ffb8;
    padding: 9px 14px; width: 220px; max-width: 60vw; text-align: center;
  }

  /* 窄屏：压缩但保持正常可读字号（不缩成小字） */
  @media (max-width: 1000px) {
    .bar { width: 130px; }
    #botbar { gap: 12px; }
    /* 窄屏只隐藏阶段名，关键数字（敌军 N/4、击毁）保留 */
    #info-phase { display: none; }
  }
  @media (max-width: 820px) {
    #topbar { height: auto; min-height: 48px; flex-wrap: wrap; padding: 6px 10px; }
    #score { font-size: 20px; }
    #banner-zone { order: 3; width: 100%; margin-top: 4px; }
    h1 { font-size: 32px; letter-spacing: 6px; }
    #over-title, #pause-title { font-size: 28px; letter-spacing: 8px; }
    .card { padding: 20px 18px; }
    #minimap-wrap.on #minimap { width: 80px; height: 80px; }
  }
</style>
</head>
<body>

<!-- 顶部栏：分数/状态 + 按钮（画布外） -->
<div id="topbar">
  <div class="tb-left">
    <div id="score">0</div>
    <div id="info"><span id="info-phase"></span><span id="info-num"></span></div>
  </div>
  <div id="banner-zone"><div id="banner" class="hidden"></div></div>
  <div class="tb-right">
    <button id="btnMap">地图：关</button>
    <button id="btnSound">♪ 声音：开</button>
    <button id="btnPause">暂停 (P)</button>
  </div>
</div>

<!-- 战场画布（独占区域） -->
<div id="stage"></div>

<!-- 底部栏：装甲/炮温/生命/剩余敌军（画布外） -->
<div id="botbar">
  <div class="stat">
    <div class="bar-label"><span>HULL 装甲</span><span id="hptext">100</span></div>
    <div class="bar"><div id="hullbar"></div></div>
  </div>
  <div class="stat">
    <div class="bar-label"><span>HEAT 炮温</span><span id="heatlabel">炮温</span></div>
    <div class="bar"><div id="heatbar"></div></div>
  </div>
  <div class="stat">
    <div class="bar-label"><span>生命</span></div>
    <div id="lives">▲▲</div>
  </div>
  <div class="stat">
    <div class="bar-label"><span>ENEMY 剩余敌军 <b id="enemy-num" style="color:#ffb8a8;font-family:Consolas,monospace">4/4</b></span></div>
    <div class="bar"><div id="enemybar"></div></div>
  </div>
  <div id="minimap-wrap">
    <canvas id="minimap" width="130" height="130"></canvas>
    <div id="minimap-label">MAP</div>
  </div>
</div>

<div id="crosshair" class="hidden"></div>
<div id="vignette"></div>

<!-- 主菜单 -->
<div id="screen-menu" class="screen">
  <div class="card">
    <h1>STEEL HORIZON</h1>
    <div class="sub">昼袭战场 · 固定歼灭战</div>
    <div class="goal">
      <b>任务</b>：歼灭全部 <b>4 辆</b>敌军——它们开局四角同时入场，无补充、无下一波。<br>
      <b>规则</b>：砖墙可被炮弹击毁（2 发）开辟捷径；<b>钢墙</b>不可摧毁，需绕行。敌人会追猎你：隔墙寻路、贴墙侧翼、破砖开路。<b>2 条命</b>耗尽即失败，全灭即胜。<br>
      <b>操作</b>：<span class="k">W A S D</span> 移动 · <span class="k">鼠标</span> 瞄准 · <span class="k">左键/空格</span> 射击（注意炮温） · <span class="k">P</span> 暂停 · <span class="k">M</span> 静音 · <span class="k">R</span> 重开
    </div>
    <div class="diff-row">
      <button class="diff-btn" data-diff="easy">简单</button>
      <button class="diff-btn sel" data-diff="normal">普通</button>
      <button class="diff-btn" data-diff="hard">困难</button>
    </div>
    <button id="btnStart" class="primary">出 击</button>
    <div class="board-box" id="menu-board"></div>
  </div>
</div>

<!-- 暂停 -->
<div id="screen-pause" class="screen hidden">
  <div class="card">
    <div id="pause-title">已暂停</div>
    <div id="pause-stats" style="font-size:14px;color:#b8d49a;margin-bottom:18px"></div>
    <button id="btnResume" class="primary">继续 (P)</button>
    <div class="btn-row">
      <button id="btnRestartPause">重新开始</button>
      <button id="btnMenuPause">主菜单</button>
    </div>
  </div>
</div>

<!-- 结算 -->
<div id="screen-over" class="screen hidden">
  <div class="card">
    <div id="over-title" class="lose">任务失败</div>
    <div id="over-reason"></div>
    <div id="over-stats"></div>
    <div class="btn-row">
      <input id="name-input" maxlength="10" placeholder="呼号" value="TANKER" />
      <button id="btnSave">录入排行榜</button>
    </div>
    <div class="btn-row">
      <button id="btnAgain" class="primary">再次出击 (R)</button>
      <button id="btnMenu">主菜单</button>
    </div>
    <div class="board-box" id="over-board"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
